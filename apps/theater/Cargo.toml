[package]
name = "nyx-theater"
version = "0.1.0"
description = "A unified Plex and Jellyfin theater for Nyx"
edition.workspace = true
license.workspace = true

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-media-model = { path = "../../crates/nyx-media-model" }
nyx-media-cache = { path = "../../crates/nyx-media-cache" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nyx-plex = { path = "../../crates/nyx-plex" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
async-channel = "2"
nyx-jellyfin = { path = "../../crates/nyx-jellyfin" }

rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
