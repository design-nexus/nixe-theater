[package]
name = "nixe-theater"
version = "0.1.0"
description = "A unified Plex and Jellyfin theater for Nixe"
edition.workspace = true
license.workspace = true

[dependencies]
nixe-core = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-core", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-theme = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-ui = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-playback = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-media-model = { path = "../../crates/nixe-media-model" }
nixe-media-cache = { path = "../../crates/nixe-media-cache" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nixe-plex = { path = "../../crates/nixe-plex" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
async-channel = "2"
nixe-jellyfin = { path = "../../crates/nixe-jellyfin" }

rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
