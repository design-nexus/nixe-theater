[package]
name = "nixe-theater"
version = "0.1.0"
description = "A unified Plex and Jellyfin theater for Nixe"
edition.workspace = true
license.workspace = true

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "87682e6c936b6a4f006639b1a1c099e96346c07c" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "64786dc295708951013c126351f1830664a7d15d" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "64786dc295708951013c126351f1830664a7d15d" }
nixe-playback = { git = "https://github.com/design-nexus/nixe-design.git", rev = "64786dc295708951013c126351f1830664a7d15d" }
nixe-media-model = { path = "../../crates/nixe-media-model" }
nixe-media-cache = { path = "../../crates/nixe-media-cache" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nixe-plex = { path = "../../crates/nixe-plex" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
async-channel = "2"
nixe-jellyfin = { path = "../../crates/nixe-jellyfin" }

rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
